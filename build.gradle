buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Standard Android Gradle Plugin
        classpath 'com.android.tools.build:gradle:8.1.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
